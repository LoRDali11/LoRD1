<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LoRD Academy - منصة الطالب</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #050505;
            color: #d4af37;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* خلفية النجوم المحسنة */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.3); }
        }

        .gold-gradient {
            background: linear-gradient(to bottom, #f9f295, #e0aa3e, #b88a44, #816021);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass-card {
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (min-width: 1024px) {
            .glass-card:hover {
                border-color: #d4af37;
                transform: translateY(-10px);
                box-shadow: 0 15px 40px rgba(212, 175, 55, 0.2);
            }
        }
        
        .glass-card:active {
            transform: scale(0.98);
            border-color: #d4af37;
        }

        .download-btn {
            background: linear-gradient(135deg, #d4af37 0%, #816021 100%);
            color: black;
            font-weight: 900;
            transition: 0.3s;
        }

        /* إخفاء شريط التمرير بشكل جمالي */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 10px; }

        input, textarea {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }
    </style>
</head>
<body>

    <div id="stars" class="stars-container"></div>

    <div class="relative z-10 min-h-screen flex flex-col p-4 sm:p-6 md:p-10">
        <!-- Header -->
        <header class="text-center py-10 sm:py-16 mb-8 sm:mb-12 border-b-2 border-[#d4af37] bg-black/60 rounded-b-[40px] sm:rounded-b-[80px] shadow-2xl px-4">
            <h1 class="text-4xl sm:text-6xl md:text-8xl font-black uppercase gold-gradient tracking-tighter leading-tight">
                LoRD Academy
            </h1>
            <h2 class="text-xl sm:text-2xl md:text-4xl text-white font-bold mt-2 sm:mt-4 tracking-wide">منصة الطالب</h2>
            <div class="prepared-by mt-3 text-lg sm:text-xl opacity-90">إعداد / علي جلال</div>
            <div class="mt-6 sm:mt-8 inline-block px-6 sm:px-10 py-2 sm:py-3 bg-[#d4af37]/10 border border-[#d4af37] rounded-full text-white font-bold text-sm sm:text-base animate-pulse">
                ﷺ صلي على النبي ﷺ
            </div>
        </header>

        <!-- Tabs -->
        <div class="flex flex-wrap justify-center gap-3 sm:gap-6 mb-10 sm:mb-16">
            <button onclick="changeSection('courses')" id="tab-courses" class="flex-1 max-w-[150px] sm:max-w-[200px] py-3 sm:py-4 rounded-xl sm:rounded-2xl font-black text-xs sm:text-xl transition-all bg-[#d4af37] text-black shadow-[0_0_20px_rgba(212,175,55,0.4)]">
                المقررات
            </button>
            <button onclick="changeSection('summaries')" id="tab-summaries" class="flex-1 max-w-[150px] sm:max-w-[200px] py-3 sm:py-4 rounded-xl sm:rounded-2xl font-black text-xs sm:text-xl transition-all border border-[#d4af37]/40 text-[#d4af37]">
                التلخيصات
            </button>
            <button onclick="changeSection('contact')" id="tab-contact" class="flex-1 max-w-[150px] sm:max-w-[200px] py-3 sm:py-4 rounded-xl sm:rounded-2xl font-black text-xs sm:text-xl transition-all border border-[#d4af37]/40 text-[#d4af37]">
                تواصل معنا
            </button>
        </div>

        <!-- Grid المحتوى المتجاوب -->
        <div id="main-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-10 max-w-7xl mx-auto w-full px-2">
            <!-- سيتم حقن المحتوى هنا -->
        </div>

        <!-- Footer -->
        <footer class="mt-20 py-10 text-center border-t border-[#d4af37]/20">
            <p class="text-[#d4af37] opacity-60 text-sm sm:text-lg">LoRD Academy &copy; 2025</p>
            <p class="text-white/30 mt-2 text-xs sm:text-sm font-bold uppercase tracking-widest">Designed for Excellence</p>
        </footer>
    </div>

    <script>
        // ==========================================
        // منطقة الإعدادات (رقم الهاتف)
        // ==========================================
        const MY_PHONE_NUMBER = "201020289403"; 
        const DISPLAY_PHONE = "01020289403";

        const DATA = {
            courses: [
                { title: "الأدب العباسي", icon: "📜", link: "https://drive.google.com/uc?export=download&id=1JFqVDwBMfp9_WHvi9scF_faNJJ1pNAi1" },
                { title: "تحليل نصوص أدبية", icon: "✍️", link: "https://drive.google.com/uc?export=download&id=1dzNBYpWO2vQazMAdaeZgCzL-I6CNijyk" },
                { title: "التدريس المصغر 2", icon: "🏫", link: "https://drive.google.com/uc?export=download&id=1CuKOXVBYXgGMzsXO19r_YY8al-rneV4V" },
                { title: "تعليم اللغة العربية لغير الناطقين بها", icon: "🌍", link: "https://drive.google.com/uc?export=download&id=1blqRW0AvCTfx4WIZVfQLaXswzbd3e2PN" },
                { title: "تقنيات المعلومات والاتصال", icon: "💻", link: "https://drive.google.com/uc?export=download&id=1f5vbpCLB3eJgw_UrmxRRJDi74DhFvhdi" },
                { title: "تقييم التعلم", icon: "📝", link: "https://drive.google.com/uc?export=download&id=1frWmdqsButzuwVQwDhfUrsQTQgPrphGO" },
                { title: "سيكولوجية التعلم", icon: "🧠", link: "https://drive.google.com/uc?export=download&id=1tybdMa_lhdD_EbWRiugDPyh_k0EJqSD6" },
                { title: "علم البديع 1", icon: "📕", link: "https://drive.google.com/uc?export=download&id=1868OBvqeiHyvJ0B-U9EksSf1T6kVuyb0" },
                { title: "علم البديع 2", icon: "📕", link: "https://drive.google.com/uc?export=download&id=1uR1ogQ0g6SlqDC69MSeCEs06C_mSGGV6" },
                { title: "قضايا إسلامية", icon: "🕌", link: "https://drive.google.com/uc?export=download&id=16gSxPtHo1xXDKrwpFu73C02JCSM5qsSX" },
                { title: "مصادر لغوية وأدبية", icon: "📚", link: "https://drive.google.com/uc?export=download&id=1STXB2g8N-ego3Frej2ngc_YEMtRnREVa" },
                { title: "مفاهيم لغوية", icon: "📖", link: "https://drive.google.com/uc?export=download&id=17oUJVmKTSjrCGd5t0yjX3dLGSRtzN5yw" }
            ],
            summaries: []
        };

        let currentSection = 'courses';

        function render() {
            const grid = document.getElementById('main-grid');
            
            if (currentSection === 'contact') {
                grid.innerHTML = `
                    <div class="col-span-full max-w-2xl mx-auto w-full glass-card p-6 sm:p-10 rounded-[30px] sm:rounded-[40px] text-center">
                        <div class="text-5xl sm:text-7xl mb-6 gold-gradient">💬</div>
                        <h3 class="text-2xl font-black text-white mb-4">تواصل مع المطور</h3>
                        <p class="text-[#d4af37] font-bold text-xl mb-4" dir="ltr">${DISPLAY_PHONE}</p>
                        <p class="text-[#d4af37] opacity-80 mb-8 text-sm sm:text-base">بإمكانك إرسال شكوى، اقتراح، أو طلب مساعدة وسأرد عليك في أقرب وقت.</p>
                        
                        <div class="space-y-6 text-right">
                            <div>
                                <label class="block text-white mb-2 font-bold mr-2">رسالتك:</label>
                                <textarea id="user-message" rows="5" class="w-full rounded-2xl p-4 text-white" placeholder="اكتب ما يدور في ذهنك هنا..."></textarea>
                            </div>
                            <button onclick="sendToWhatsApp()" class="download-btn w-full py-4 sm:py-5 rounded-xl sm:rounded-2xl text-lg sm:text-xl shadow-lg active:scale-95 flex items-center justify-center gap-3">
                                <span>إرسال عبر واتساب</span>
                                <span>🚀</span>
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            const items = DATA[currentSection];
            
            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 opacity-40 text-xl">لا يوجد محتوى حالياً في هذا القسم.</div>`;
                return;
            }

            grid.innerHTML = items.map(item => `
                <div class="glass-card p-6 sm:p-10 rounded-[30px] sm:rounded-[40px] text-center flex flex-col justify-between h-full relative overflow-hidden group">
                    <div class="absolute top-0 right-0 p-4 sm:p-6 opacity-5 text-4xl sm:text-5xl group-hover:opacity-20 transition-opacity">lord</div>
                    <div>
                        <div class="text-5xl sm:text-7xl mb-6 sm:mb-8 filter drop-shadow-[0_0_15px_rgba(212,175,55,0.5)] transform group-hover:scale-110 transition-transform">
                            ${item.icon}
                        </div>
                        <h3 class="text-xl sm:text-2xl font-black text-white mb-8 sm:mb-10 min-h-[50px] sm:min-h-[70px] flex items-center justify-center leading-relaxed px-2">
                            ${item.title}
                        </h3>
                    </div>
                    <a href="${item.link}" target="_blank" class="download-btn w-full py-4 sm:py-5 rounded-xl sm:rounded-2xl text-lg sm:text-xl shadow-lg active:scale-95">
                        تحميل الملف
                    </a>
                </div>
            `).join('');
        }

        function sendToWhatsApp() {
            const message = document.getElementById('user-message').value;
            if (!message.trim()) {
                alert("يرجى كتابة الرسالة أولاً!");
                return;
            }
            
            const encodedMessage = encodeURIComponent("رسالة من طالب عبر منصة LoRD Academy:\n\n" + message);
            const whatsappURL = `https://wa.me/${MY_PHONE_NUMBER}?text=${encodedMessage}`;
            
            window.open(whatsappURL, '_blank');
        }

        function changeSection(section) {
            currentSection = section;
            const btnCourses = document.getElementById('tab-courses');
            const btnSummaries = document.getElementById('tab-summaries');
            const btnContact = document.getElementById('tab-contact');

            [btnCourses, btnSummaries, btnContact].forEach(btn => {
                btn.className = "flex-1 max-w-[150px] sm:max-w-[200px] py-3 sm:py-4 rounded-xl sm:rounded-2xl font-black text-xs sm:text-xl transition-all border border-[#d4af37]/40 text-[#d4af37]";
            });

            const activeBtn = section === 'courses' ? btnCourses : (section === 'summaries' ? btnSummaries : btnContact);
            activeBtn.className = "flex-1 max-w-[150px] sm:max-w-[200px] py-3 sm:py-4 rounded-xl sm:rounded-2xl font-black text-xs sm:text-xl transition-all bg-[#d4af37] text-black shadow-[0_0_20px_rgba(212,175,55,0.4)]";
            
            render();
        }

        const stars = document.getElementById('stars');
        const count = window.innerWidth < 600 ? 40 : 100;
        for (let i = 0; i < count; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.width = Math.random() * 2 + 1 + 'px';
            s.style.height = s.style.width;
            s.style.top = Math.random() * 100 + '%';
            s.style.left = Math.random() * 100 + '%';
            s.style.animationDelay = Math.random() * 5 + 's';
            stars.appendChild(s);
        }

        render();
    </script>
</body>
</html>
