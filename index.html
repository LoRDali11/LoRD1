<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoRD Academy - منصة الطالب</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #050505;
            color: #d4af37;
            margin: 0;
            overflow-x: hidden;
        }

        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.3); }
        }

        .gold-gradient {
            background: linear-gradient(to bottom, #f9f295, #e0aa3e, #b88a44, #816021);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass-card {
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-card:hover {
            border-color: #d4af37;
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.2);
        }

        .download-btn {
            background: linear-gradient(135deg, #d4af37 0%, #816021 100%);
            color: black;
            font-weight: 900;
            transition: 0.3s;
        }

        .download-btn:hover {
            box-shadow: 0 0 20px #d4af37;
            transform: scale(1.05);
            background: white;
        }
    </style>
</head>
<body>

    <div id="stars" class="stars-container"></div>

    <div class="relative z-10 min-h-screen flex flex-col p-4 md:p-10">
        <!-- Header -->
        <header class="text-center py-12 mb-12 border-b-2 border-[#d4af37] bg-black/60 rounded-b-[60px] shadow-2xl">
            <h1 class="text-6xl md:text-8xl font-black uppercase gold-gradient tracking-tighter">
                LoRD Academy
            </h1>
            <h2 class="text-2xl md:text-4xl text-white font-bold mt-4 tracking-wide">منصة الطالب</h2>
            <div class="prepared-by mt-4 text-xl opacity-90">إعداد / علي جلال</div>
            <div class="mt-8 inline-block px-10 py-3 bg-[#d4af37]/10 border border-[#d4af37] rounded-full text-white font-bold animate-pulse">
                ﷺ صلي على النبي ﷺ
            </div>
        </header>

        <!-- Tabs -->
        <div class="flex flex-wrap justify-center gap-6 mb-16">
            <button onclick="changeSection('courses')" id="tab-courses" class="px-12 py-4 rounded-2xl font-black text-xl transition-all bg-[#d4af37] text-black shadow-[0_0_30px_rgba(212,175,55,0.4)]">
                المقررات الدراسية
            </button>
            <button onclick="changeSection('summaries')" id="tab-summaries" class="px-12 py-4 rounded-2xl font-black text-xl transition-all border border-[#d4af37]/40 text-[#d4af37] hover:border-[#d4af37]">
                التلخيصات الهامة
            </button>
        </div>

        <!-- Grid -->
        <div id="main-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10 max-w-7xl mx-auto w-full">
            <!-- Content will be injected here -->
        </div>

        <!-- Footer -->
        <footer class="mt-24 py-12 text-center border-t border-[#d4af37]/20">
            <p class="text-[#d4af37] opacity-60 text-lg">LoRD Academy &copy; 2025</p>
            <p class="text-white/30 mt-2 font-bold uppercase tracking-widest">Designed for Excellence</p>
        </footer>
    </div>

    <script>
        // ==========================================
        // منطقة التعديل: أضف ملفاتك هنا بسهولة
        // ==========================================
        
        const DATA = {
            // 1. قسم المقررات
            courses: [
                { title: "الأدب العباسي", icon: "📜", link: "https://drive.google.com/uc?export=download&id=1JFqVDwBMfp9_WHvi9scF_faNJJ1pNAi1" },
                { title: "تحليل نصوص أدبية", icon: "✍️", link: "https://drive.google.com/uc?export=download&id=1dzNBYpWO2vQazMAdaeZgCzL-I6CNijyk" },
                { title: "التدريس المصغر 2", icon: "🏫", link: "https://drive.google.com/uc?export=download&id=1CuKOXVBYXgGMzsXO19r_YY8al-rneV4V" },
                { title: "تعليم اللغة العربية لغير الناطقين بها", icon: "🌍", link: "https://drive.google.com/uc?export=download&id=1blqRW0AvCTfx4WIZVfQLaXswzbd3e2PN" },
                { title: "تقنيات المعلومات والاتصال", icon: "💻", link: "https://drive.google.com/uc?export=download&id=1f5vbpCLB3eJgw_UrmxRRJDi74DhFvhdi" },
                { title: "تقييم التعلم", icon: "📝", link: "https://drive.google.com/uc?export=download&id=1frWmdqsButzuwVQwDhfUrsQTQgPrphGO" },
                { title: "سيكولوجية التعلم", icon: "🧠", link: "https://drive.google.com/uc?export=download&id=1tybdMa_lhdD_EbWRiugDPyh_k0EJqSD6" },
                { title: "علم البديع 1", icon: "📕", link: "https://drive.google.com/uc?export=download&id=1868OBvqeiHyvJ0B-U9EksSf1T6kVuyb0" },
                { title: "علم البديع 2", icon: "📕", link: "https://drive.google.com/uc?export=download&id=1uR1ogQ0g6SlqDC69MSeCEs06C_mSGGV6" },
                { title: "قضايا إسلامية", icon: "🕌", link: "https://drive.google.com/uc?export=download&id=16gSxPtHo1xXDKrwpFu73C02JCSM5qsSX" },
                { title: "مصادر لغوية وأدبية", icon: "📚", link: "https://drive.google.com/uc?export=download&id=1STXB2g8N-ego3Frej2ngc_YEMtRnREVa" },
                { title: "مفاهيم لغوية", icon: "📖", link: "https://drive.google.com/uc?export=download&id=17oUJVmKTSjrCGd5t0yjX3dLGSRtzN5yw" }
            ],
            // 2. قسم التلخيصات (فارغ الآن لإضافة ملفاتك)
            summaries: []
        };

        // ==========================================
        // كود النظام (لا داعي لتعديله)
        // ==========================================

        let currentSection = 'courses';

        function render() {
            const grid = document.getElementById('main-grid');
            const items = DATA[currentSection];
            
            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 opacity-40 text-2xl">لا يوجد محتوى في هذا القسم حالياً.</div>`;
                return;
            }

            grid.innerHTML = items.map(item => `
                <div class="glass-card p-10 rounded-[40px] text-center flex flex-col justify-between h-full relative overflow-hidden group">
                    <div class="absolute top-0 right-0 p-6 opacity-5 text-5xl group-hover:opacity-20 transition-opacity">👑</div>
                    <div>
                        <div class="text-7xl mb-8 filter drop-shadow-[0_0_15px_rgba(212,175,55,0.5)] transform group-hover:scale-110 transition-transform">
                            ${item.icon}
                        </div>
                        <h3 class="text-2xl font-black text-white mb-10 min-h-[70px] flex items-center justify-center leading-relaxed">
                            ${item.title}
                        </h3>
                    </div>
                    <a href="${item.link}" target="_blank" class="download-btn w-full py-5 rounded-2xl text-xl shadow-lg active:scale-95">
                        تحميل المقرر
                    </a>
                </div>
            `).join('');
        }

        function changeSection(section) {
            currentSection = section;
            document.getElementById('tab-courses').className = section === 'courses' ? "px-12 py-4 rounded-2xl font-black text-xl transition-all bg-[#d4af37] text-black shadow-[0_0_30px_rgba(212,175,55,0.4)]" : "px-12 py-4 rounded-2xl font-black text-xl transition-all border border-[#d4af37]/40 text-[#d4af37] hover:border-[#d4af37]";
            document.getElementById('tab-summaries').className = section === 'summaries' ? "px-12 py-4 rounded-2xl font-black text-xl transition-all bg-[#d4af37] text-black shadow-[0_0_30px_rgba(212,175,55,0.4)]" : "px-12 py-4 rounded-2xl font-black text-xl transition-all border border-[#d4af37]/40 text-[#d4af37] hover:border-[#d4af37]";
            render();
        }

        // إنشاء النجوم
        const stars = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.width = Math.random() * 3 + 'px';
            s.style.height = s.style.width;
            s.style.top = Math.random() * 100 + '%';
            s.style.left = Math.random() * 100 + '%';
            s.style.animationDelay = Math.random() * 5 + 's';
            stars.appendChild(s);
        }

        render();
    </script>
</body>
</html>
